name: Publish to PyPI

# Fires only on a version tag (e.g. `git tag v0.1.0 && git push --tags`).
# Uses PyPI Trusted Publishing (OIDC), so no API token is stored in the repo.
on:
  push:
    tags: ["v*"]

jobs:
  # Gate the release on the suite: a tag must never publish a failing build.
  # The same four shards as ci.yml, warm from main's compilation caches (a tag
  # run can read the default branch's caches, and the tagged code is main's).
  test:
    name: test (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        shard: [1, 2, 3, 4]
    env:
      OMP_NUM_THREADS: "2"
      XLA_PYTHON_CLIENT_PREALLOCATE: "false"
      DFTAX_TEST_RSS_GB: "6"     # see ci.yml
      JAX_COMPILATION_CACHE_DIR: ${{ github.workspace }}/.jax-cache
      JAX_PERSISTENT_CACHE_MIN_COMPILE_TIME_SECS: "0"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v8.2.0
        with:
          cache-dependency-glob: "pyproject.toml"
      - name: Sync (test extra)
        run: uv sync --extra test
      - name: Lint
        run: uv run ruff check .
      - name: JAX compilation cache
        uses: actions/cache/restore@v6
        with:
          path: .jax-cache
          key: jax-${{ runner.os }}-shard${{ matrix.shard }}of4-${{ hashFiles('pyproject.toml', 'dftax/**/*.py', 'tests/**') }}
          restore-keys: |
            jax-${{ runner.os }}-shard${{ matrix.shard }}of4-
      - name: Test (shard ${{ matrix.shard }} of 4)
        run: uv run pytest tests/unit -m "not slow" -q --shard ${{ matrix.shard }}/4

  publish:
    needs: [test]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write          # required for OIDC trusted publishing
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v8.2.0
        with:
          cache-dependency-glob: "pyproject.toml"
      - name: Build
        run: uv build
      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
